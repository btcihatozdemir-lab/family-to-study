<!DOCTYPE html>
<html lang="tr">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#080d1a">
  <meta name="description" content="FamilyToStudy - Aile İçi Oyunlaştırma, Görev Takibi ve Çocuk Odaklanma Sistemi.">

  <!-- iOS PWA meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FamilyToStudy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="shortcut icon" type="image/png" href="favicon.png">

  <title>FamilyToStudy | Aile Akademisi & Odaklanma</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #080d1a;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    /* Özel FamilyToStudy Splash Ekranı */
    #loading-splash {
      position: fixed;
      inset: 0;
      z-index: 999999;
      background: radial-gradient(circle at 50% 35%, #151e36 0%, #080d1a 75%, #04060c 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
    }

    #loading-splash.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .ambient-glow {
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(236, 72, 153, 0.15) 50%, transparent 70%);
      filter: blur(40px);
      animation: pulseGlow 3s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .logo-container {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      animation: floatLogo 3s ease-in-out infinite alternate;
    }

    .logo-img {
      width: 100px;
      height: 100px;
      border-radius: 28px;
      object-fit: cover;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 35px rgba(99, 102, 241, 0.45);
      border: 2px solid rgba(255, 255, 255, 0.12);
      z-index: 2;
    }

    .logo-ring {
      position: absolute;
      inset: -8px;
      border-radius: 36px;
      border: 2px dashed rgba(129, 140, 248, 0.4);
      animation: rotateRing 12s linear infinite;
    }

    .brand-title {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 30%, #a5b4fc 70%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      z-index: 2;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(99, 102, 241, 0.18);
      border: 1px solid rgba(129, 140, 248, 0.35);
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      color: #c7d2fe;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 28px;
      z-index: 2;
    }

    .progress-bar-wrap {
      width: 200px;
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      z-index: 2;
    }

    .progress-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 50%;
      background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899);
      border-radius: 10px;
      animation: progressIndeterminate 1.8s ease-in-out infinite;
    }

    .status-text {
      margin-top: 14px;
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      letter-spacing: 0.3px;
      z-index: 2;
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.9); opacity: 0.6; }
      100% { transform: scale(1.15); opacity: 1; }
    }

    @keyframes floatLogo {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }

    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes progressIndeterminate {
      0% { left: -50%; width: 30%; }
      50% { left: 30%; width: 55%; }
      100% { left: 100%; width: 30%; }
    }
  </style>
</head>
<body>
  <!-- Özel Animasyonlu Açılış Ekranı (Splash) -->
  <div id="loading-splash">
    <div class="ambient-glow"></div>
    <div class="logo-container">
      <div class="logo-ring"></div>
      <img src="kids-logo.png" alt="FamilyToStudy" class="logo-img" onerror="this.src='favicon.png'">
    </div>
    <div class="brand-title">FamilyToStudy</div>
    <div class="brand-badge">⚡ Aile Akademisi & Odaklanma</div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill"></div>
    </div>
    <div class="status-text">Canlı sistem senkronizasyonu başlatılıyor...</div>
  </div>

  <script>
    // Flutter ilk frame'i çizdiğinde splash ekranını pürüzsüzce kaldır
    function hideSplash() {
      const splash = document.getElementById('loading-splash');
      if (splash && !splash.classList.contains('fade-out')) {
        splash.classList.add('fade-out');
        setTimeout(() => {
          if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
        }, 600);
      }
    }

    window.addEventListener('flutter-first-frame', hideSplash);

    // Yedek gözlemci: Flutter DOM elementlerini eklediği anda yakala
    const observer = new MutationObserver((mutations) => {
      for (const m of mutations) {
        for (const node of m.addedNodes) {
          if (node.tagName === 'FLUTTER-VIEW' || node.tagName === 'FLT-GLASS-PANE') {
            setTimeout(hideSplash, 150);
            observer.disconnect();
            return;
          }
        }
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Zaman aşımı koruması (maksimum 6 saniye sonra zorla aç)
    setTimeout(hideSplash, 6000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
