name: Build Flutter Web Apps (Fam & Kids)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'ios-app/**'
      - '.github/workflows/build-flutter-web.yml'
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd ios-app
          flutter pub get

      - name: Build FamilyToStudy Kids Web
        run: |
          cd ios-app
          flutter build web --release -t lib/main_kids.dart --base-href "/" -o build/web_kids

      - name: Build FamilyToStudy Fam Web
        run: |
          cd ios-app
          flutter build web --release -t lib/main_fam.dart --base-href "/" -o build/web_fam

      - name: Build Ecosystem Portal Web
        run: |
          cd ios-app
          flutter build web --release -t lib/main.dart --base-href "/" -o build/web

      - name: Upload Kids Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: familytostudy-kids-web
          path: ios-app/build/web_kids
          if-no-files-found: error

      - name: Upload Fam Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: familytostudy-fam-web
          path: ios-app/build/web_fam
          if-no-files-found: error

      - name: Upload Combined Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-bundle
          path: ios-app/build/web
          if-no-files-found: error
