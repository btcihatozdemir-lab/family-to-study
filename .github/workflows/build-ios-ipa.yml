name: 'Build Flutter iOS Native Apps (Fam & Kids IPAs)'

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'ios-app/**'
      - '.github/workflows/build-ios-ipa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Environment
        run: flutter doctor -v

      - name: Generate Xcode Project Skeleton
        run: |
          cd ios-app
          mkdir -p /tmp/ios_custom_backup
          cp -f ios/Podfile /tmp/ios_custom_backup/Podfile 2>/dev/null || true
          cp -f ios/Runner/Info.plist /tmp/ios_custom_backup/Info.plist 2>/dev/null || true
          cp -f ios/Runner/AppDelegate.swift /tmp/ios_custom_backup/AppDelegate.swift 2>/dev/null || true
          
          flutter create --platforms=ios --org com.familytostudy .
          
          # Restore customized configurations only (Podfile, Info.plist, AppDelegate)
          cp -f /tmp/ios_custom_backup/Podfile ios/Podfile
          cp -f /tmp/ios_custom_backup/Info.plist ios/Runner/Info.plist
          cp -f /tmp/ios_custom_backup/AppDelegate.swift ios/Runner/AppDelegate.swift
          
          # Ensure iOS 15.0 minimum deployment target across all Xcode configurations
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/Runner.xcodeproj/project.pbxproj 2>/dev/null || true
          
          # Inject dummy Development Team & disable code signing for unsigned IPA generation
          sed -i '' 's/DevelopmentTeam = "";/DevelopmentTeam = "9AA9AA9AA9";/g' ios/Runner.xcodeproj/project.pbxproj 2>/dev/null || true
          sed -i '' 's/DEVELOPMENT_TEAM = "";/DEVELOPMENT_TEAM = 9AA9AA9AA9;/g' ios/Runner.xcodeproj/project.pbxproj 2>/dev/null || true
          
          echo "CODE_SIGNING_ALLOWED = NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED = NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY = " >> ios/Flutter/Release.xcconfig
          echo "DEVELOPMENT_TEAM = 9AA9AA9AA9" >> ios/Flutter/Release.xcconfig

      - name: Install Dependencies and CocoaPods
        run: |
          cd ios-app
          flutter pub get
          cd ios
          pod install --repo-update

      - name: Build FamilyToStudy Kids iOS 15.8+ Release (Unsigned)
        run: |
          cd ios-app
          # Apply Kids Custom App Icon
          mkdir -p ios/Runner/Assets.xcassets/AppIcon.appiconset
          cp -rf ios_icons/kids/AppIcon.appiconset/* ios/Runner/Assets.xcassets/AppIcon.appiconset/
          
          # Set Kids Display Name & Bundle Identifier
          sed -i '' 's/<string>FamilyToStudy<\/string>/<string>Family Kids<\/string>/g' ios/Runner/Info.plist 2>/dev/null || true
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = com.familytostudy.kids;/g' ios/Runner.xcodeproj/project.pbxproj 2>/dev/null || true

          flutter build ios --release --no-codesign -t lib/main_kids.dart
          rm -rf Payload
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -q FamilyToStudy_Kids_iOS15.ipa Payload
          rm -rf Payload
          ls -lh FamilyToStudy_Kids_iOS15.ipa

      - name: Build FamilyToStudy Fam Modern iOS Release (Unsigned)
        run: |
          cd ios-app
          # Apply Fam Custom App Icon
          mkdir -p ios/Runner/Assets.xcassets/AppIcon.appiconset
          cp -rf ios_icons/fam/AppIcon.appiconset/* ios/Runner/Assets.xcassets/AppIcon.appiconset/
          
          # Set Fam Display Name & Bundle Identifier
          sed -i '' 's/<string>Family Kids<\/string>/<string>Family Fam<\/string>/g' ios/Runner/Info.plist 2>/dev/null || true
          sed -i '' 's/<string>FamilyToStudy<\/string>/<string>Family Fam<\/string>/g' ios/Runner/Info.plist 2>/dev/null || true
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = com.familytostudy.fam;/g' ios/Runner.xcodeproj/project.pbxproj 2>/dev/null || true

          flutter build ios --release --no-codesign -t lib/main_fam.dart
          rm -rf Payload
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -q FamilyToStudy_Fam_iOS.ipa Payload
          rm -rf Payload
          ls -lh FamilyToStudy_Fam_iOS.ipa

      - name: Upload Kids iOS 15.8+ .IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyToStudy_Kids_iOS15_ipa
          path: ios-app/FamilyToStudy_Kids_iOS15.ipa
          if-no-files-found: error

      - name: Upload Fam iOS .IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyToStudy_Fam_iOS_ipa
          path: ios-app/FamilyToStudy_Fam_iOS.ipa
          if-no-files-found: error

      - name: Publish to GitHub Releases (v1.0.1 Latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: FamilyToStudy Release v1.0.1
          files: |
            ios-app/FamilyToStudy_Kids_iOS15.ipa
            ios-app/FamilyToStudy_Fam_iOS.ipa
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update v1.0.0 Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: |
            ios-app/FamilyToStudy_Kids_iOS15.ipa
            ios-app/FamilyToStudy_Fam_iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
