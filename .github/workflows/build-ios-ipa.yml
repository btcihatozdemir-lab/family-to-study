name: 'Build Flutter iOS Native Apps (Fam & Kids IPAs)'

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'ios-app/**'
      - '.github/workflows/build-ios-ipa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Environment
        run: flutter doctor -v

      - name: Generate Xcode Project Skeleton
        run: |
          cd ios-app
          mkdir -p /tmp/ios_custom_backup
          cp -f ios/Podfile /tmp/ios_custom_backup/Podfile 2>/dev/null || true
          cp -f ios/Runner/Info.plist /tmp/ios_custom_backup/Info.plist 2>/dev/null || true
          cp -f ios/Runner/AppDelegate.swift /tmp/ios_custom_backup/AppDelegate.swift 2>/dev/null || true
          
          flutter create --platforms=ios --org com.familytostudy .
          
          # Restore customized configurations only (Podfile, Info.plist, AppDelegate)
          cp -f /tmp/ios_custom_backup/Podfile ios/Podfile
          cp -f /tmp/ios_custom_backup/Info.plist ios/Runner/Info.plist
          cp -f /tmp/ios_custom_backup/AppDelegate.swift ios/Runner/AppDelegate.swift
          
          # Ensure iOS 15.0 minimum deployment target across all Xcode configurations
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/Runner.xcodeproj/project.pbxproj 2>/dev/null || true

      - name: Install Dependencies and CocoaPods
        run: |
          cd ios-app
          flutter pub get
          cd ios
          pod install --repo-update

      - name: Build FamilyToStudy Kids iOS Release
        run: |
          cd ios-app
          flutter build ios --release --no-codesign -t lib/main_kids.dart
          mkdir -p Payload_Kids
          cp -r build/ios/iphoneos/Runner.app Payload_Kids/
          zip -r -q FamilyToStudy_Kids.ipa Payload_Kids
          ls -lh FamilyToStudy_Kids.ipa

      - name: Build FamilyToStudy Fam iOS Release
        run: |
          cd ios-app
          flutter build ios --release --no-codesign -t lib/main_fam.dart
          mkdir -p Payload_Fam
          cp -r build/ios/iphoneos/Runner.app Payload_Fam/
          zip -r -q FamilyToStudy_Fam.ipa Payload_Fam
          ls -lh FamilyToStudy_Fam.ipa

      - name: Upload Kids .IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyToStudy_Kids_ipa
          path: ios-app/FamilyToStudy_Kids.ipa
          if-no-files-found: error

      - name: Upload Fam .IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyToStudy_Fam_ipa
          path: ios-app/FamilyToStudy_Fam.ipa
          if-no-files-found: error

      - name: Publish to GitHub Releases (On Version Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ios-app/FamilyToStudy_Kids.ipa
            ios-app/FamilyToStudy_Fam.ipa
          name: FamilyToStudy Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
