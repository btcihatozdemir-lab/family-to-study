name: 'Build & Deploy iOS Apps (TestFlight CI/CD & Releases)'

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'ios-app/**'
      - '.github/workflows/build-ios-ipa.yml'
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: 'TestFlight Otomatik Yükleme Yapılsın mı?'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-deploy-ios:
    name: 'Build iOS Native Apps & TestFlight Deploy'
    runs-on: macos-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 3. Verify Environment & Flutter Doctor
        run: flutter doctor -v

      - name: 4. Setup Apple Code Signing Certificates (Conditional)
        id: setup_signing
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -n "$P12_BASE64" ] && [ -n "$P12_PASSWORD" ]; then
            echo "✅ Apple Dağıtım Sertifikası algılandı. Geçici Keychain kuruluyor..."
            KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
            KEYCHAIN_PASSWORD=$(uuidgen)
            
            # Geçici keychain oluştur
            security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            
            # P12 sertifikasını çöz ve içe aktar
            echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
            security import $RUNNER_TEMP/certificate.p12 -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            
            # Provisioning Profile Kur
            if [ -n "$PROVISION_PROFILE_BASE64" ]; then
              mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
              echo "$PROVISION_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
              echo "✅ Provisioning Profile başarıyla kuruldu."
            fi
            
            echo "has_signing=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Apple Sertifika Secret'ları tanımlanmamış. İmzasız/Geliştirici modunda derlenecek."
            echo "has_signing=false" >> $GITHUB_OUTPUT
          fi

      - name: 5. Setup App Store Connect API Key (Conditional)
        id: setup_api_key
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          if [ -n "$API_KEY_BASE64" ] && [ -n "$KEY_ID" ]; then
            mkdir -p ~/.appstoreconnect/private_keys
            echo "$API_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
            echo "✅ App Store Connect API Anahtarı (~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8) hazırlandı."
            echo "has_api_key=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ App Store Connect API Anahtarı eksik. TestFlight otomatik yükleme atlanacak."
            echo "has_api_key=false" >> $GITHUB_OUTPUT
          fi

      - name: 6. Generate Xcode Project Skeleton & Configurations
        run: |
          cd ios-app
          mkdir -p /tmp/ios_custom_backup
          cp -f ios/Podfile /tmp/ios_custom_backup/Podfile 2>/dev/null || true
          cp -f ios/Runner/Info.plist /tmp/ios_custom_backup/Info.plist 2>/dev/null || true
          cp -f ios/Runner/AppDelegate.swift /tmp/ios_custom_backup/AppDelegate.swift 2>/dev/null || true
          
          flutter create --platforms=ios --org com.familytostudy .
          
          # Restore customized configurations (Podfile, Info.plist, AppDelegate)
          cp -f /tmp/ios_custom_backup/Podfile ios/Podfile
          cp -f /tmp/ios_custom_backup/Info.plist ios/Runner/Info.plist
          cp -f /tmp/ios_custom_backup/AppDelegate.swift ios/Runner/AppDelegate.swift
          
          # Ensure iOS 15.0 minimum deployment target
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/Runner.xcodeproj/project.pbxproj 2>/dev/null || true

      - name: 7. Install Dependencies and CocoaPods
        run: |
          cd ios-app
          flutter pub get
          cd ios
          pod install --repo-update

      - name: 8. Build FamilyToStudy Kids iOS Package
        run: |
          cd ios-app
          mkdir -p ios/Runner/Assets.xcassets/AppIcon.appiconset
          cp -rf ios_icons/kids/AppIcon.appiconset/* ios/Runner/Assets.xcassets/AppIcon.appiconset/ 2>/dev/null || true
          
          sed -i '' 's/<string>FamilyToStudy<\/string>/<string>Family Kids<\/string>/g' ios/Runner/Info.plist 2>/dev/null || true
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = com.familytostudy.kids;/g' ios/Runner.xcodeproj/project.pbxproj 2>/dev/null || true

          if [ "${{ steps.setup_signing.outputs.has_signing }}" = "true" ]; then
            echo "🚀 İmzalı Kids IPA Derleniyor..."
            flutter build ipa --release -t lib/main_kids.dart --export-options-plist=ios/ExportOptions.plist 2>/dev/null || \
            flutter build ios --release -t lib/main_kids.dart
          else
            echo "📦 İmzasız Geliştirici Kids IPA Derleniyor..."
            flutter build ios --release --no-codesign -t lib/main_kids.dart
          fi

          rm -rf Payload
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -q FamilyToStudy_Kids_iOS15.ipa Payload
          rm -rf Payload
          ls -lh FamilyToStudy_Kids_iOS15.ipa

      - name: 9. Build FamilyToStudy Fam Management Package
        run: |
          cd ios-app
          mkdir -p ios/Runner/Assets.xcassets/AppIcon.appiconset
          cp -rf ios_icons/fam/AppIcon.appiconset/* ios/Runner/Assets.xcassets/AppIcon.appiconset/ 2>/dev/null || true
          
          sed -i '' 's/<string>Family Kids<\/string>/<string>Family Fam<\/string>/g' ios/Runner/Info.plist 2>/dev/null || true
          sed -i '' 's/<string>FamilyToStudy<\/string>/<string>Family Fam<\/string>/g' ios/Runner/Info.plist 2>/dev/null || true
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = com.familytostudy.fam;/g' ios/Runner.xcodeproj/project.pbxproj 2>/dev/null || true

          if [ "${{ steps.setup_signing.outputs.has_signing }}" = "true" ]; then
            echo "🚀 İmzalı Fam IPA Derleniyor..."
            flutter build ipa --release -t lib/main_fam.dart --export-options-plist=ios/ExportOptions.plist 2>/dev/null || \
            flutter build ios --release -t lib/main_fam.dart
          else
            echo "📦 İmzasız Geliştirici Fam IPA Derleniyor..."
            flutter build ios --release --no-codesign -t lib/main_fam.dart
          fi

          rm -rf Payload
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -q FamilyToStudy_Fam_iOS.ipa Payload
          rm -rf Payload
          ls -lh FamilyToStudy_Fam_iOS.ipa

      - name: 10. Deploy to Apple TestFlight (Automated)
        if: steps.setup_signing.outputs.has_signing == 'true' && steps.setup_api_key.outputs.has_api_key == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          echo "✈️ Apple TestFlight'a yükleme başlatılıyor..."
          
          # Fam Yönetim Uygulamasını TestFlight'a Gönder
          if [ -f "ios-app/FamilyToStudy_Fam_iOS.ipa" ]; then
            echo "Uploading Family Fam to TestFlight..."
            xcrun altool --upload-app -f ios-app/FamilyToStudy_Fam_iOS.ipa -t ios \
              --apiKey "$KEY_ID" \
              --apiIssuer "$ISSUER_ID" --show-progress || true
          fi

          # Kids Öğrenci Uygulamasını TestFlight'a Gönder
          if [ -f "ios-app/FamilyToStudy_Kids_iOS15.ipa" ]; then
            echo "Uploading Family Kids to TestFlight..."
            xcrun altool --upload-app -f ios-app/FamilyToStudy_Kids_iOS15.ipa -t ios \
              --apiKey "$KEY_ID" \
              --apiIssuer "$ISSUER_ID" --show-progress || true
          fi
          echo "✅ TestFlight gönderim adımı tamamlandı!"

      - name: 11. Upload GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FamilyToStudy_iOS_Builds
          path: |
            ios-app/FamilyToStudy_Kids_iOS15.ipa
            ios-app/FamilyToStudy_Fam_iOS.ipa
          if-no-files-found: error

      - name: 12. Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: FamilyToStudy Release v1.0.2 (TestFlight & Standalone)
          files: |
            ios-app/FamilyToStudy_Kids_iOS15.ipa
            ios-app/FamilyToStudy_Fam_iOS.ipa
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
