name: Build Flutter iOS Native App (.IPA)

on:
  push:
    paths:
      - 'ios-app/**'
      - '.github/workflows/build-ios-ipa.yml'
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Environment
        run: flutter doctor -v

      - name: Install Flutter Dependencies
        run: |
          cd ios-app
          flutter pub get

      - name: CocoaPods Install (Target: iOS 15.0+)
        run: |
          cd ios-app/ios
          pod install --repo-update

      - name: Build iOS Release (Unsigned for Sideloadly)
        run: |
          cd ios-app
          flutter build ios --release --no-codesign

      - name: Package Runner.app into Standard .IPA (Payload format)
        run: |
          cd ios-app
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -q FamilyOS_iOS_Universal.ipa Payload
          ls -lh FamilyOS_iOS_Universal.ipa
          echo "FamilyOS_iOS_Universal.ipa paketi başarıyla üretildi!"

      - name: Upload .IPA as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyOS_iOS_Universal_ipa
          path: ios-app/FamilyOS_iOS_Universal.ipa
          if-no-files-found: error

      - name: Publish to GitHub Releases (On Version Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ios-app/FamilyOS_iOS_Universal.ipa
          name: FamilyOS Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
